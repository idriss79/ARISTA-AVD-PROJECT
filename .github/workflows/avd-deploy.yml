name: "Arista AVD Deploy via Self-Hosted Runner"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  avd_deployment:
    name: "Générer et Déployer AVD depuis le Runner Local"
    # ⚠️ Obligatoire pour utiliser votre runner physique 192.168.100.60
    runs-on: self-hosted 

    steps:
      - name: "1. Récupérer le code du dépôt Git"
        uses: actions/checkout@v4

      - name: "2. Installer les prérequis système (si manquants sur le runner)"
        run: |
          sudo apt update && sudo apt install -y python3-pip python3-venv git

      - name: "3. Installer Ansible et les dépendances AVD"
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install "pyavd[ansible]"
          ansible-galaxy collection install arista.avd

      - name: "4. Exécuter le Playbook Arista AVD"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          source venv/bin/activate
          # Exécution du playbook directement vers les IPs d'EVE-NG
          ansible-playbook -i inventory.yml dc1_playbook.yml --extra-vars "ansible_password=${{ secrets.AVD_PASSWORD }}"