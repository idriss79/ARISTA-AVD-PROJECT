name: "Arista AVD Deploy via Self-Hosted Runner"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  avd_deployment:
    name: "Déporter le déploiement sur la VM Ansible via SSH"
    runs-on: self-hosted

    steps:
      - name: "1. Récupérer le code du dépôt Git"
        uses: actions/checkout@v4

      - name: "2. Exécuter le Playbook via Clé SSH"
        shell: powershell
        run: |
          # Chaîne de commandes envoyée à la VM Linux : navigation, activation venv et exécution d'Ansible
          $remoteCmd = "cd ~/avd-project && git pull origin main || true && source venv/bin/activate && ansible-playbook -i inventory.yml dc1_playbook.yml --extra-vars 'ansible_password=${{ secrets.AVD_PASSWORD }}'"
          
          # Exécution de la commande à distance (StrictHostKeyChecking=no évite le prompt de validation d'empreinte)
          ssh -o StrictHostKeyChecking=no idriss@192.168.100.121 "$remoteCmd"
